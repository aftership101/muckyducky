<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>muckyducky</title>
<link rel="stylesheet" href="styles.css?v=5">
<script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script defer src="app.js?v=5"></script>
</head>
<body><main>
<div class="status"><span id="dot" class="dot"></span><span id="status" role="status" aria-live="polite">offline</span><span id="timer">00:00</span></div>
<div id="setup">
<label for="password">room password</label>
<input type="password" id="password" autocomplete="off" spellcheck="false" placeholder="shared password" minlength="4">
<label for="micSelect">microphone</label>
<select id="micSelect" aria-label="microphone"><option value="">default</option></select>
</div>
<div class="controls">
<button id="callBtn">call</button>
<button id="muteBtn" hidden>mute</button>
<button id="endBtn" hidden>hang up</button>
<button id="restoreBtn" hidden>restore audio</button>
</div>
<p id="error" role="alert" hidden></p>
<details><summary>diagnostics</summary>
<div class="diag">
<div><h2>you</h2><p id="localState">offline</p></div>
<div><h2>other person</h2><p id="remoteState">offline</p></div>
</div>
<h2 class="eventsTitle">events</h2><pre id="diagnostics">—</pre>
</details>
<audio id="remoteAudio" autoplay playsinline></audio>
</main></body></html>
